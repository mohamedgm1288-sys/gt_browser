<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #121212; }
        .top-bar { display: flex; padding: 10px; background: #1a1a2e; align-items: center; gap: 10px; z-index: 10; position: relative; }
        .logo { color: #bb86fc; font-weight: 900; font-size: 24px; margin: 0; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; font-size: 16px; background: #e0e0e0; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #bb86fc; color: #000; font-weight: bold; cursor: pointer; }
        iframe { width: 100%; height: calc(100vh - 65px); border: none; background: white; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1 class="logo">GT</h1>
        <input type="text" id="urlInput" placeholder="ابحث في جوجل أو اكتب رابط...">
        <button onclick="go()">روح</button>
    </div>
    <iframe id="myFrame" src="https://www.google.com/search?igu=1" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-presentation"></iframe>

    <script>
        function go() {
            var url = document.getElementById('urlInput').value;
            if (!url.startsWith('http')) {
                // لو كتب كلام عادي، نروح لبحث جوجل
                url = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(url);
            }
            document.getElementById('myFrame').src = url;
        }
    </script>
</body>
</html>
